name: MintTorrent public builds
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: minttorrent-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Scan public source
        run: python3 scripts/audit-public-export.py .
      - name: Test export scanner
        run: python3 -m unittest discover -s tests -p test_public_export_audit.py
      - name: Check shell syntax
        run: find scripts -name '*.sh' -print0 | xargs -0 -n1 bash -n
  ubuntu20:
    name: Ubuntu 20.04 server and desktop
    needs: source-check
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      MINTTORRENT_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Podman
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends podman
      - name: Build and test public server package
        run: ./scripts/build-ubuntu20-podman.sh
      - name: Build and test desktop package
        run: ./scripts/build-desktop-ubuntu20-podman.sh
      - name: Scan release assets
        run: python3 scripts/audit-public-export.py build/dist-ubuntu20 dist
      - uses: actions/upload-artifact@v4
        with:
          name: MintTorrent-ubuntu20-x86_64
          path: |
            build/dist-ubuntu20/*.tar.gz
            build/dist-ubuntu20/*.sha256
            dist/*ubuntu20*.tar.gz
            dist/*ubuntu20*.sha256
          if-no-files-found: error
          retention-days: 14
  windows-cross:
    name: Windows x64 cross-build
    needs: source-check
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      MINTTORRENT_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build mingw-w64 libboost-dev libvulkan-dev \
            python3-venv curl ca-certificates p7zip-full perl
      - name: Provision Qt and cross dependencies
        run: ./scripts/bootstrap-desktop-windows.sh
      - name: Build and package
        run: |
          ./scripts/build-desktop.sh windows
          ./scripts/package-desktop-windows.py
      - name: Scan release assets
        run: python3 scripts/audit-public-export.py dist
      - uses: actions/upload-artifact@v4
        with:
          name: MintTorrent-windows-x86_64
          path: |
            dist/*.zip
            dist/*.zip.sha256
          if-no-files-found: error
          retention-days: 14
